# zzChatTTS Configuration

# Default voice parameters
[voice]
temperature = 0.3
top_p = 0.7
top_k = 20
sample_rate = 24000

# Device settings
[device]
# Auto-detect by default, can be 'cuda' or 'cpu'
device = auto

# Model settings
[model]
# Whether to compile the model (experimental)
compile = false

# Output settings
[output]
# Default output directory
output_dir = ./outputs
# Default output format
format = wav
